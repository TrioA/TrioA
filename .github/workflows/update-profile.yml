name: Update Profile Telemetry

on:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'src/**'
      - '.github/workflows/**'
  schedule:
    # Run once daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  build-and-update:
    name: Generate Profile SVGs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Generate Profile Telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: User can provide a PAT with repo scope in Secrets named PROFILE_PAT for private stats
          PAT: ${{ secrets.PROFILE_PAT }}
        run: |
          python src/main.py --verbose

      - name: Validate Output Files
        run: |
          test -f assets/dark_mode.svg || { echo "Missing dark_mode.svg"; exit 1; }
          test -f assets/light_mode.svg || { echo "Missing light_mode.svg"; exit 1; }

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): update telemetry and profile SVGs [skip ci]"
          file_pattern: "assets/*.svg cache/*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
